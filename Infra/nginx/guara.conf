# Fonte de verdade do nginx do Guará (stack mínimo).
# Mantenha em sincronia com o bloco `configs.guara_nginx_conf.content` do docker-compose.yml.
# (Aqui usamos `$` normal; no docker-compose o `$` precisa ser escapado como `$$`.)

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=30s;
    client_max_body_size 100m;

    # Dashboard + API do Guará (container futuro "guara-api:8080") — 502 até ser publicada
    location /guara/ {
        set $guara_api http://guara-api:8080;
        proxy_pass $guara_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stream SSE (tempo real do painel) — buffering DESLIGADO, timeout longo
    location /guara/api/v1/stream {
        set $guara_api http://guara-api:8080;
        proxy_pass $guara_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # Documentação da API (Scalar / OpenAPI)
    location /scalar {
        set $guara_api http://guara-api:8080;
        proxy_pass $guara_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
